[project]
name = "cert-deploy-pro"
version = "0.1.0"
description = "Cert Deploy Pro — self-hosted certificate lifecycle management backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "celery[redis]>=5.4",
  "asyncssh>=2.17",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "authlib>=1.3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires the local disposable SSH/nginx/apache target (tests/integration)"]

[tool.ruff]
line-length = 110
target-version = "py312"
